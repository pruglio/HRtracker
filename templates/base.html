<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-title" content="Entrevistas">
  <meta name="application-name" content="Entrevistas">
  <title>{% block title %}Entrevistas{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>

  <nav class="app-navbar">
    <div class="app-navbar-inner">
      <a class="app-brand" href="{{ url_for('index') }}">
        <span class="app-brand-icon"><i class="fas fa-briefcase"></i></span>
        Entrevistas
      </a>
      <button class="navbar-toggler-custom" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="app-nav-links">
          <li><a class="app-nav-link" href="{{ url_for('index') }}"><i class="fas fa-list me-1"></i>Postulaciones</a></li>
          <li><a class="app-nav-link" href="{{ url_for('new_interview_global') }}"><i class="fas fa-calendar-plus me-1"></i>Entrevista</a></li>
          <li><a class="app-nav-link" href="{{ url_for('new_application') }}"><i class="fas fa-plus me-1"></i>Nueva</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="app-main-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
